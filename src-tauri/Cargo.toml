[package]
name = "voxloom"
version = "0.1.5"
description = "Private, offline meeting memory for Linux"
edition = "2021"
rust-version = "1.85"

[lib]
name = "voxloom_core"
path = "src/lib.rs"

[[bin]]
name = "voxloom"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
