# Checks on Windows and Linux when anything but documentation changes; a push
# that touches only Markdown or docs/ runs nothing. The Windows runtime comes
# from windows-runtime.yml (cached); the real-engine job downloads the pinned
# models once and caches them. Apps are built by apps.yml, not here.
name: CI

on:
  push:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  # This repository's own branches are checked by their pushes; a pull request
  # runs the checks only when it comes from a fork.
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Every check after setup runs even if an earlier one failed, so one run
# reports all failures; the job still fails.
jobs:
  windows-runtime:
    name: Windows runtime
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/windows-runtime.yml
    with:
      fixtures: true

  windows:
    name: Windows
    needs: windows-runtime
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: windows-runtime
          path: src-tauri
      - name: Bundled FFmpeg on PATH for the tests
        shell: bash
        run: echo "$GITHUB_WORKSPACE/src-tauri/engines" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-
      - run: npm ci
      - name: Bundled runtime starts on Windows
        if: ${{ !cancelled() }}
        run: python scripts/windows-runtime-smoke.py src-tauri
      - name: TypeScript, privacy rules and version
        if: ${{ !cancelled() }}
        run: npm run check
      - name: Python unit tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: UI tests (Edge, the engine WebView2 uses)
        if: ${{ !cancelled() }}
        run: npx playwright test
        env:
          PLAYWRIGHT_CHROME: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
      - name: Rust unit tests (including Job Objects)
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Build the desktop app
        if: ${{ !cancelled() }}
        run: npx tauri build --debug --no-bundle
      - name: Launch, close and leave nothing running
        if: ${{ !cancelled() }}
        run: python scripts/native-smoke-windows.py src-tauri/target/debug/voxloom.exe
        env:
          PYTHONUTF8: "1"

  windows-engines:
    name: Windows real engines
    needs: windows-runtime
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: windows-runtime
          path: src-tauri
      - uses: actions/download-artifact@v7
        with:
          name: fixtures
          path: fixtures
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-engines-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-engines-cargo-
      - uses: actions/cache/restore@v5
        id: models
        with:
          path: models-cache
          key: models-${{ hashFiles('models/manifest.json') }}
      - name: Pinned models (Whisper, Parakeet, embeddings, E2B summaries)
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python worker/provision.py --download --directory models-cache
          python worker/provision.py --download --model parakeet --directory models-cache
      - uses: actions/cache/save@v5
        if: steps.models.outputs.cache-hit != 'true'
        with:
          path: models-cache
          key: ${{ steps.models.outputs.cache-primary-key }}
      - name: Import, transcribe, index, search, summarise, export, delete
        shell: pwsh
        run: |
          # The engines must open models through a path with non-ASCII letters.
          New-Item -ItemType Junction -Path "$env:RUNNER_TEMP\modèles Zoë" -Target "$env:GITHUB_WORKSPACE\models-cache" | Out-Null
          $env:VOXLOOM_TEST_ROOT = "$env:GITHUB_WORKSPACE"
          $env:VOXLOOM_TEST_MODELS = "$env:RUNNER_TEMP\modèles Zoë"
          $env:VOXLOOM_TEST_FIXTURES = "$env:GITHUB_WORKSPACE\fixtures"
          $env:VOXLOOM_TEST_PYTHON = "$env:GITHUB_WORKSPACE\src-tauri\python\python.exe"
          $env:VOXLOOM_TEST_WHISPER_CLI = "$env:GITHUB_WORKSPACE\src-tauri\engines\whisper-cli.exe"
          $env:VOXLOOM_TEST_TRANSCRIBE_CLI = "$env:GITHUB_WORKSPACE\src-tauri\engines\transcribe-cli.exe"
          $env:VOXLOOM_TEST_LLAMA_CLI = "$env:GITHUB_WORKSPACE\src-tauri\engines\llama-completion.exe"
          $env:VOXLOOM_TEST_REPORT = "$env:RUNNER_TEMP\windows-engine-metrics.json"
          $env:Path = "$env:GITHUB_WORKSPACE\src-tauri\engines;$env:Path"
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --test workflow real_offline_import -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP\windows-engine-metrics.json"
      # A recording is transcribed after Stop, from its 30-second files; this
      # pass is stopped after its first chunk and resumed from the checkpoint.
      - name: A recording's pass after Stop, stopped half-way and resumed
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $recording = "$env:RUNNER_TEMP\recording Zoë"
          New-Item -ItemType Directory -Path $recording | Out-Null
          $env:Path = "$env:GITHUB_WORKSPACE\src-tauri\engines;$env:Path"
          ffmpeg -nostdin -v error -i fixtures\voxloom-long.wav -ar 16000 -ac 1 -c:a flac -f segment -segment_time 30 -reset_timestamps 1 "$recording\s0000-mic-%06d.flac"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/transcribe-recording.py --recording $recording --model models-cache\ggml-base.en.bin --whisper-cli src-tauri\engines\whisper-cli.exe --out "$env:RUNNER_TEMP\rows.json" --stop-after 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,sys; rows=json.load(open(sys.argv[1],encoding='utf-8'))['rows']; text=' '.join(r['text'] for r in rows); print(text); assert text.lower().count('budget')>=3, text" "$env:RUNNER_TEMP\rows.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          PYTHONUTF8: "1"
      - name: The same with Accurate (Parakeet), stopped half-way and resumed
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $recording = "$env:RUNNER_TEMP\recording Zoë accurate"
          New-Item -ItemType Directory -Path $recording | Out-Null
          $env:Path = "$env:GITHUB_WORKSPACE\src-tauri\engines;$env:Path"
          ffmpeg -nostdin -v error -i fixtures\voxloom-long.wav -ar 16000 -ac 1 -c:a flac -f segment -segment_time 30 -reset_timestamps 1 "$recording\s0000-mic-%06d.flac"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/transcribe-recording.py --recording $recording --engine parakeet --model models-cache\parakeet-tdt-0.6b-v2-Q6_K.gguf --transcribe-cli src-tauri\engines\transcribe-cli.exe --out "$env:RUNNER_TEMP\rows-accurate.json" --stop-after 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,sys; rows=json.load(open(sys.argv[1],encoding='utf-8'))['rows']; text=' '.join(r['text'] for r in rows); print(text); assert text.lower().count('budget')>=3, text" "$env:RUNNER_TEMP\rows-accurate.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          PYTHONUTF8: "1"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: windows-engine-metrics
          path: ${{ runner.temp }}/windows-engine-metrics.json
          if-no-files-found: ignore

  linux:
    name: Linux
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf ffmpeg
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: linux-cargo-
      - run: npm ci
      - name: TypeScript, privacy rules and version
        if: ${{ !cancelled() }}
        run: npm run check
      - name: Python unit tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: UI tests
        if: ${{ !cancelled() }}
        run: npx playwright test
      - name: Rust unit tests
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Clippy
        if: ${{ !cancelled() }}
        run: |
          mkdir -p src-tauri/engines
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
