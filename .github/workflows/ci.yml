# Fast checks on Windows and Linux for every push. Nothing here downloads
# models or runs the real engines; see AGENTS.md for the opt-in checks.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Every check after npm ci runs even if an earlier one failed, so one run
# reports all failures; the job still fails.
jobs:
  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-
      - run: npm ci
      - name: TypeScript, privacy rules and version
        if: ${{ !cancelled() }}
        run: npm run check
      - name: Python unit tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: UI tests (Edge, the engine WebView2 uses)
        if: ${{ !cancelled() }}
        run: npx playwright test
        env:
          PLAYWRIGHT_CHROME: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
      - name: Rust unit tests
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Clippy
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p src-tauri/engines
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Build the desktop app
        if: ${{ !cancelled() }}
        run: npx tauri build --debug --no-bundle
      - name: Launch, close and leave nothing running
        if: ${{ !cancelled() }}
        run: python scripts/native-smoke-windows.py src-tauri/target/debug/voxloom.exe
        env:
          PYTHONUTF8: "1"

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf ffmpeg
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: linux-cargo-
      - run: npm ci
      - name: TypeScript, privacy rules and version
        if: ${{ !cancelled() }}
        run: npm run check
      - name: Python unit tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: UI tests
        if: ${{ !cancelled() }}
        run: npx playwright test
      - name: Rust unit tests
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Clippy
        if: ${{ !cancelled() }}
        run: |
          mkdir -p src-tauri/engines
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
